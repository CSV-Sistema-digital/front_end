<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finalizar pedido | CSV</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="checkout">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">CSV</span>
        <small>Gráfica Digital</small>
      </a>
      <nav>
        <a href="index.html">Início</a>
        <a href="pedidos.html">Meus pedidos</a>
        <a class="active" href="carrinho.html">Carrinho <b class="cart-count">0</b></a>
        <a href="conta.html">Minha conta</a>
      </nav>
    </header>

    <main class="container">
      <a class="back-link" href="carrinho.html">← Voltar ao carrinho</a>
      <p class="eyebrow">QUASE LÁ</p>
      <h1>Finalizar <span>pedido</span></h1>

      <p id="feedback" role="status" class="feedback"></p>
      <form id="profileForm" class="panel form-panel account-form" hidden>
        <h2>Perfil do cliente</h2>
        <div class="form-grid">
          <label>Nome completo <input required name="nome" maxlength="150" autocomplete="name"></label>
          <label>CPF <input required name="cpf" inputmode="numeric" maxlength="18"></label>
          <label>E-mail da conta <input name="email" type="email" readonly></label>
          <label>Telefone com DDD <input required name="telefone" type="tel" maxlength="20" autocomplete="tel"></label>
        </div>
        <button class="btn" type="submit">Salvar perfil</button>
      </form>
      <form id="checkoutForm" class="checkout-grid" hidden>
        <section class="panel form-panel">
          <h2>Forma de pagamento</h2>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="pagamento" value="PIX" checked>
              <span>◇</span>
              <strong>PIX</strong>
              <small>Simulado</small>
            </label>
            <label class="payment-option">
              <input type="radio" name="pagamento" value="CARTAO">
              <span>▣</span>
              <strong>Cartão</strong>
              <small>Simulado</small>
            </label>
            <label class="payment-option">
              <input type="radio" name="pagamento" value="BOLETO">
              <span>▤</span>
              <strong>Boleto</strong>
              <small>Simulado</small>
            </label>
          </div>
        </section>

        <aside class="panel summary">
          <h2>Resumo do pedido</h2>
          <div id="checkoutSummary"></div>
          <div class="summary-line total">
            <span>Total</span>
            <strong id="checkoutTotal"></strong>
          </div>
          <button class="btn full" type="submit">🔒 Confirmar pedido</button>
        </aside>
      </form>
    </main>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
