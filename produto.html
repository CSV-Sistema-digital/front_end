<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do produto | CSV</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="detail">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">CSV</span>
        <small>Gráfica Digital</small>
      </a>
      <nav>
        <a href="index.html">Início</a>
        <a class="active" href="index.html#catalogo">Produtos</a>
        <a href="pedidos.html">Meus pedidos</a>
        <a href="carrinho.html">Carrinho <b class="cart-count">0</b></a>
        <a href="conta.html">Minha conta</a>
      </nav>
    </header>

    <main class="container">
      <a class="back-link" href="index.html">← Voltar para o catálogo</a>
      <p id="feedback" role="status" class="feedback"></p>
      <section class="product-detail panel" hidden>
        <div class="product-gallery">
          <div class="product-photo large" id="detailImage"></div>
        </div>
        <div class="detail-copy">
          <p class="eyebrow">DETALHES DO PRODUTO</p>
          <h1 id="detailName"></h1>
          <p class="muted" id="detailCategory"></p>
          <p id="detailDescription"></p>
          <div class="detail-price" id="detailPrice"></div>
          <div class="purchase-row">
            <div class="quantity">
              <button data-qty="-1">−</button>
              <output id="quantity">1</output>
              <button data-qty="1">+</button>
            </div>
            <button class="btn" id="addDetail">🛒 Adicionar ao carrinho</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
