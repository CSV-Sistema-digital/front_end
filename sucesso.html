<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido recebido | CSV</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="success">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">CSV</span>
        <small>Gráfica Digital</small>
      </a>
      <nav>
        <a href="index.html">Início</a>
        <a href="pedidos.html">Meus pedidos</a>
        <a href="conta.html">Minha conta</a>
      </nav>
    </header>
    <main class="container success-wrap">
      <p id="feedback" role="status" class="feedback"></p>
      <section class="panel success-card" hidden>
        <div class="success-check">✓</div>
        <p class="eyebrow">CONFIRMAÇÃO</p>
        <h1>Pagamento <span>confirmado!</span></h1>
        <p>A confirmação do pagamento simulado foi registrada.</p>
        <div class="order-number">
          Número do pedido
          <strong id="orderNumber"></strong>
        </div>
        <p id="successStatus"></p>
        <a class="btn" id="detailsLink" href="pedidos.html">▣ Acompanhar pedido</a>
        <a class="btn secondary" href="index.html">⌂ Voltar para o início</a>
      </section>
    </main>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
